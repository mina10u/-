<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コードラボ｜画面遷移図 (SVG)</title>
<style>
:root {
  --bg: #0b1120;
  --panel: #111b2e;
  --border: #2b3b55;
  --text: #e8eef8;
  --muted: #9aaac0;
  --accent: #38bdf8;
  --primary: #2563eb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Meiryo, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden; /* 画面枠自体の余分な揺れを防止 */
}

/* ヘッダー・共通ナビゲーション */
header {
  padding: 12px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}

.nav-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.nav-link {
  background: #1e293b;
  color: var(--accent);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: bold;
  transition: all 0.2s;
}

.nav-link.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

.nav-link:hover { background: #334155; }

.header-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

h1 { font-size: 1.25rem; color: var(--accent); }

/* 拡大・縮小ツールバー */
.zoom-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #1e293b;
  padding: 4px 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.zoom-btn {
  background: #0f172a;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: bold;
}

.zoom-btn:hover {
  background: var(--primary);
  color: #ffffff;
}

.zoom-level {
  font-size: 0.8rem;
  min-width: 50px;
  text-align: center;
  color: var(--accent);
}

/* 表示ビューア領域（縦横スクロール可能） */
.viewer-container {
  flex: 1;
  width: 100%;
  height: 100%;
  overflow: auto;
  background: #060a12;
  padding: 40px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* SVGを包むラッパー（白背景で図のコントラストを確保） */
.svg-wrapper {
  transform-origin: top center;
  transition: transform 0.15s ease-out;
  display: inline-block;
  background: #ffffff;
  padding: 24px;
  border-radius: 10px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
}

/* ★ポイント：SVGの自動縮小を無効化し、文字がしっかり読める標準幅に設定★ */
.svg-wrapper img,
.svg-wrapper object {
  display: block;
  width: 1100px; /* 文字がつぶれず快適に読める横幅 */
  max-width: none !important;
  height: auto;
}
</style>
</head>
<body>

<header>
  <div class="nav-bar">
    <a href="index.html" class="nav-link">📄 仕様書</a>
    <a href="RDD.html" class="nav-link">📋 要件定義書</a>
    <a href="diagram.html" class="nav-link active">🔀 画面遷移図</a>
    <a href="activity.html" class="nav-link">⚡ アクティビティ図</a>
    <a href="er.html" class="nav-link">🗄️ ER図</a>
    <a href="mockup.html" class="nav-link">🖥️ モック画面</a>
  </div>
  <div class="header-content">
    <div>
      <h1>画面遷移・システム機能フロー図 (SVG)</h1>
      <p style="color: var(--muted); font-size: 0.8rem;">※ マウスホイールやバーでスクロール、右上のボタンで自由にズーム倍率を変更できます</p>
    </div>
    <div class="zoom-tools">
      <button class="zoom-btn" onclick="zoom(-0.15)">➖ 縮小</button>
      <span class="zoom-level" id="zoomText">100%</span>
      <button class="zoom-btn" onclick="zoom(0.15)">➕ 拡大</button>
      <button class="zoom-btn" onclick="resetZoom()">リセット</button>
    </div>
  </div>
</header>

<main class="viewer-container" id="viewerContainer">
  <div class="svg-wrapper" id="svgWrapper">
    <img src="flowchart.svg" alt="コードラボ 画面遷移図" id="targetSvg" onerror="this.style.display='none'; document.getElementById('svg-fallback').style.display='block';">
    <div id="svg-fallback" style="display:none; color: #ef4444; padding: 40px; font-weight: bold; background: #fee2e2; border-radius: 8px;">
      ⚠️ SVGファイル（<code>flowchart.svg</code>）が見つかりません。リポジトリ内にファイルをアップロードしてください。
    </div>
  </div>
</main>

<script>
  let currentScale = 1.0;
  const svgWrapper = document.getElementById('svgWrapper');
  const zoomText = document.getElementById('zoomText');

  function updateZoom() {
    svgWrapper.style.transform = `scale(${currentScale})`;
    zoomText.textContent = `${Math.round(currentScale * 100)}%`;
  }

  function zoom(delta) {
    currentScale = Math.min(Math.max(currentScale + delta, 0.3), 2.5);
    updateZoom();
  }

  function resetZoom() {
    currentScale = 1.0;
    updateZoom();
  }
</script>

</body>
</html>
